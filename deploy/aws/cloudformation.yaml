AWSTemplateFormatVersion: "2010-09-09"
Description: ERISAPros production dashboard infrastructure

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  OriginVerifyToken:
    Type: String
    NoEcho: true
    MinLength: 32
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
  GitBranch:
    Type: String
    Default: codex/aws-production-deployment
  FieldRulesAdminEmails:
    Type: String
    Default: support@highlandtech.ai

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ContainerRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the 15 newest images",
              "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 15},
              "action": {"type": "expire"}
            }]
          }

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: ERISAPros production application credentials
      SecretString: "{}"

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: erisapros-production-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: erisapros-dashboard-web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: erisapros-production
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/erisapros-production-api
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/erisapros-production-sharefile-worker
      RetentionInDays: 30

  ShareFileWorkDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: erisapros-production-sharefile-work-dlq
      MessageRetentionPeriod: 1209600

  ShareFileWorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: erisapros-production-sharefile-work
      VisibilityTimeout: 43200
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ShareFileWorkDeadLetterQueue.Arn
        maxReceiveCount: 3

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadApplicationSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PrivateFileStorage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${FilesBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FilesBucket.Arn
        - PolicyName: ShareFileWorkQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ShareFileWorkQueue.Arn

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public CloudFront origin for ERISAPros API
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ERISAPros API tasks accept traffic only from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8001
          ToPort: 8001
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  ApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: !Ref SubnetIds
      Type: application
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "120"

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8001
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApiLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: application/json
            MessageBody: '{"detail":"Direct origin access is not allowed."}'

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ApiListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Erisapros-Origin
            Values: [!Ref OriginVerifyToken]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: erisapros-production-api
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub "${ContainerRepository.RepositoryUri}:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 8001
              Protocol: tcp
          Environment:
            - Name: APP_ENVIRONMENT
              Value: production
            - Name: AUTH_ENABLED
              Value: "true"
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET_NAME
              Value: !Ref FilesBucket
            - Name: COGNITO_REGION
              Value: !Ref AWS::Region
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref UserPool
            - Name: COGNITO_APP_CLIENT_ID
              Value: !Ref UserPoolClient
            - Name: FIELD_RULES_ADMIN_EMAILS
              Value: !Ref FieldRulesAdminEmails
            - Name: GROUNDX_API_BASE_URL
              Value: https://api.groundx.ai/api/v1
            - Name: GROUNDX_POLL_SECONDS
              Value: "3"
            - Name: GROUNDX_MAX_WAIT_SECONDS
              Value: "90"
            - Name: LOW_CONFIDENCE_THRESHOLD
              Value: "0.8"
            - Name: SHAREFILE_SUBDOMAIN
              Value: erisapros
            - Name: SHAREFILE_DISCOVER_SHARED_FOLDERS
              Value: "true"
            - Name: SHAREFILE_POLL_ENABLED
              Value: "false"
            - Name: SHAREFILE_POLL_INTERVAL_SECONDS
              Value: "300"
            - Name: SHAREFILE_WEBHOOK_AUTO_REGISTER_ENABLED
              Value: "false"
            - Name: SHAREFILE_WORK_QUEUE_URL
              Value: !Ref ShareFileWorkQueue
            - Name: FTWLINK_ENDPOINT_URL
              Value: https://www.ftwilliam.com/cgi-bin/ICmkKdJDZincjf9goHWVUbID/ftwLink/ftwLink.cgi
            - Name: FTW_PLAN_PAGE_URL_TEMPLATE
              Value: https://www.ftwilliam.com/
          Secrets:
            - Name: MONGODB_URI
              ValueFrom: !Sub "${AppSecret}:MONGODB_URI::"
            - Name: GROUNDX_API_KEY
              ValueFrom: !Sub "${AppSecret}:GROUNDX_API_KEY::"
            - Name: GROUNDX_BUCKET_ID
              ValueFrom: !Sub "${AppSecret}:GROUNDX_BUCKET_ID::"
            - Name: SHAREFILE_CLIENT_ID
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_CLIENT_ID::"
            - Name: SHAREFILE_CLIENT_SECRET
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_CLIENT_SECRET::"
            - Name: SHAREFILE_REDIRECT_URL
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_REDIRECT_URL::"
            - Name: SHAREFILE_WEBHOOK_URL
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_WEBHOOK_URL::"
            - Name: SHAREFILE_WEBHOOK_TOKEN
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_WEBHOOK_TOKEN::"
            - Name: SHAREFILE_INTAKE_FOLDER_ID
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_INTAKE_FOLDER_ID::"
            - Name: SHAREFILE_INTAKE_FOLDER_PATH
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_INTAKE_FOLDER_PATH::"
            - Name: FTWLINK_KEY_ID
              ValueFrom: !Sub "${AppSecret}:FTWLINK_KEY_ID::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiListenerRule
    Properties:
      ServiceName: erisapros-production-api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      HealthCheckGracePeriodSeconds: 180
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8001
          TargetGroupArn: !Ref ApiTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref SubnetIds

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: erisapros-production-sharefile-worker
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: sharefile-worker
          Image: !Sub "${ContainerRepository.RepositoryUri}:latest"
          Essential: true
          Command: ["-m", "app.sharefile_worker"]
          Environment:
            - Name: APP_ENVIRONMENT
              Value: production
            - Name: AUTH_ENABLED
              Value: "true"
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET_NAME
              Value: !Ref FilesBucket
            - Name: COGNITO_REGION
              Value: !Ref AWS::Region
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref UserPool
            - Name: COGNITO_APP_CLIENT_ID
              Value: !Ref UserPoolClient
            - Name: FIELD_RULES_ADMIN_EMAILS
              Value: !Ref FieldRulesAdminEmails
            - Name: GROUNDX_API_BASE_URL
              Value: https://api.groundx.ai/api/v1
            - Name: GROUNDX_POLL_SECONDS
              Value: "3"
            - Name: GROUNDX_MAX_WAIT_SECONDS
              Value: "90"
            - Name: LOW_CONFIDENCE_THRESHOLD
              Value: "0.8"
            - Name: SHAREFILE_SUBDOMAIN
              Value: erisapros
            - Name: SHAREFILE_DISCOVER_SHARED_FOLDERS
              Value: "true"
            - Name: SHAREFILE_POLL_ENABLED
              Value: "false"
            - Name: SHAREFILE_WEBHOOK_AUTO_REGISTER_ENABLED
              Value: "false"
            - Name: SHAREFILE_WORK_QUEUE_URL
              Value: !Ref ShareFileWorkQueue
            - Name: FTWLINK_ENDPOINT_URL
              Value: https://www.ftwilliam.com/cgi-bin/ICmkKdJDZincjf9goHWVUbID/ftwLink/ftwLink.cgi
            - Name: FTW_PLAN_PAGE_URL_TEMPLATE
              Value: https://www.ftwilliam.com/
          Secrets:
            - Name: MONGODB_URI
              ValueFrom: !Sub "${AppSecret}:MONGODB_URI::"
            - Name: GROUNDX_API_KEY
              ValueFrom: !Sub "${AppSecret}:GROUNDX_API_KEY::"
            - Name: GROUNDX_BUCKET_ID
              ValueFrom: !Sub "${AppSecret}:GROUNDX_BUCKET_ID::"
            - Name: SHAREFILE_CLIENT_ID
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_CLIENT_ID::"
            - Name: SHAREFILE_CLIENT_SECRET
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_CLIENT_SECRET::"
            - Name: SHAREFILE_REDIRECT_URL
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_REDIRECT_URL::"
            - Name: SHAREFILE_WEBHOOK_URL
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_WEBHOOK_URL::"
            - Name: SHAREFILE_WEBHOOK_TOKEN
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_WEBHOOK_TOKEN::"
            - Name: SHAREFILE_INTAKE_FOLDER_ID
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_INTAKE_FOLDER_ID::"
            - Name: SHAREFILE_INTAKE_FOLDER_PATH
              ValueFrom: !Sub "${AppSecret}:SHAREFILE_INTAKE_FOLDER_PATH::"
            - Name: FTWLINK_KEY_ID
              ValueFrom: !Sub "${AppSecret}:FTWLINK_KEY_ID::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: erisapros-production-sharefile-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref SubnetIds

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildAndPushBackend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ContainerRepository.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  BackendBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: erisapros-production-backend
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            pre_build:
              commands:
                - git clone --depth 1 --branch "$GIT_BRANCH" https://github.com/TaimoorSohail1/Erisapros_dashboard.git source
                - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$IMAGE_REPO_URI"
            build:
              commands:
                - docker build --pull -t "$IMAGE_REPO_URI:latest" source/backend
                - docker push "$IMAGE_REPO_URI:latest"
          cache:
            paths:
              - /root/.cache/pip/**/*
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: IMAGE_REPO_URI
            Value: !GetAtt ContainerRepository.RepositoryUri
          - Name: GIT_BRANCH
            Value: !Ref GitBranch

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "erisapros-${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !GetAtt ApiLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Erisapros-Origin
                HeaderValue: !Ref OriginVerifyToken
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
                - Origin
              Cookies:
                Forward: all
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ShareFilePollScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Poll ShareFile every 5 minutes so new folders and files are processed automatically
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: sharefile-poll
          Arn: !GetAtt ShareFileWorkQueue.Arn
          Input: '{"type":"poll","payload":{}}'

  ShareFileWorkQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ShareFileWorkQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeScheduledPoll
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ShareFileWorkQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ShareFilePollScheduleRule.Arn

Outputs:
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FilesBucketName:
    Value: !Ref FilesBucket
  RepositoryUri:
    Value: !GetAtt ContainerRepository.RepositoryUri
  AppSecretArn:
    Value: !Ref AppSecret
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  WebsiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  BuildProjectName:
    Value: !Ref BackendBuild
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt ApiService.Name
  WorkerServiceName:
    Value: !GetAtt WorkerService.Name
  ShareFileWorkQueueUrl:
    Value: !Ref ShareFileWorkQueue
